name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: candidatai-api
          source: ./backend
          region: us-central1
          env_vars: GNEWS_API_KEY=${{ secrets.GNEWS_API_KEY }},PORTAL_TRANSPARENCIA_TOKEN=${{ secrets.PORTAL_TRANSPARENCIA_TOKEN }}
