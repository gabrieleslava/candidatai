name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Docker image
        run: |
          cd backend
          gcloud auth configure-docker us-central1-docker.pkg.dev
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/candidatai/api:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/candidatai/api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy candidatai-api \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/candidatai/api:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars GNEWS_API_KEY=${{ secrets.GNEWS_API_KEY }},PORTAL_TRANSPARENCIA_TOKEN=${{ secrets.PORTAL_TRANSPARENCIA_TOKEN }}
